name: Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

env:
  GOTOOLCHAIN: local

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true

      - name: Run Tests with Race Detector
        run: go test -v -race ./...

      - name: Verify Code Coverage
        run: go test -coverprofile=coverage.out ./...

  release:
    name: Build & Release Multi-Platform Binaries
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output_name: pack2txt-linux-amd64
          - goos: linux
            goarch: arm64
            output_name: pack2txt-linux-arm64
          - goos: darwin
            goarch: amd64
            output_name: pack2txt-darwin-amd64
          - goos: darwin
            goarch: arm64
            output_name: pack2txt-darwin-arm64
          - goos: windows
            goarch: amd64
            output_name: pack2txt-windows-amd64.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          go build -ldflags="-s -w -X main.Version=${VERSION} -X main.BuildDate=$(date +'%Y-%m-%d')" -o dist/${{ matrix.output_name }} ./cmd/pack2txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: dist/${{ matrix.output_name }}

  publish-release:
    name: Publish GitHub Release
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*/*
          generate_release_notes: true
