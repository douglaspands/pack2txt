name: Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  release:
    types: [published, created]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GOTOOLCHAIN: local

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true

      - name: Run Tests with Race Detector
        run: go test -v -race ./...

      - name: Verify Code Coverage
        run: go test -coverprofile=coverage.out ./...

  release:
    name: Build Multi-Platform Binaries
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output_name: pack2txt-linux-amd64
          - goos: linux
            goarch: arm64
            output_name: pack2txt-linux-arm64
          - goos: darwin
            goarch: amd64
            output_name: pack2txt-darwin-amd64
          - goos: darwin
            goarch: arm64
            output_name: pack2txt-darwin-arm64
          - goos: windows
            goarch: amd64
            output_name: pack2txt-windows-amd64.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          RAW_TAG="${{ github.event.release.tag_name || github.ref_name }}"
          VERSION="${RAW_TAG#refs/tags/}"
          mkdir -p dist
          go build -ldflags="-s -w -X main.Version=${VERSION} -X main.BuildDate=$(date +'%Y-%m-%d')" -o dist/${{ matrix.output_name }} ./cmd/pack2txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: dist/${{ matrix.output_name }}
          retention-days: 1

  publish-release:
    name: Publish GitHub Release Assets
    needs: release
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum pack2txt-* > checksums.txt
          cat checksums.txt

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: |
            dist/pack2txt-*
            dist/checksums.txt
          generate_release_notes: true
